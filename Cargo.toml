[package]
name = "bingwall-rs"
version = "0.1.0"
edition = "2021"
description = "A tiny Bing daily wallpaper changer for Windows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/narcis2007/bingwall-rs"
keywords = ["bing", "wallpaper", "windows", "tray"]
categories = ["os::windows-apis"]

# The package is called bingwall-rs; the library and the program stay "bingwall".
[lib]
name = "bingwall"
path = "src/lib.rs"

[[bin]]
name = "bingwall"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
